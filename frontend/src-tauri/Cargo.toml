[package]
name = "dataforge-analytics"
version = "1.0.0"
description = "DataForge Analytics — local data analysis desktop app"
authors = ["DataForge"]
edition = "2021"

[lib]
name = "dataforge_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
open = "5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
