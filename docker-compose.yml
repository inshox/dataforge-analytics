# DataForge Analytics — optional full stack
# Default local dev uses SQLite + embedded Python (no Docker required).
#
# Usage:
#   docker compose up api          # API only (port 8000)
#   docker compose up              # API + Postgres + Redis
#   docker compose --profile web up  # includes Next.js (dev-oriented)

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - dataforge_data:/data
    environment:
      DATAFORGE_DATA_DIR: /data
      SEED_DEMO_ON_STARTUP: "true"

  postgres:
    image: postgres:16-alpine
    profiles: ["db"]
    environment:
      POSTGRES_USER: dataforge
      POSTGRES_PASSWORD: dataforge
      POSTGRES_DB: dataforge
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    profiles: ["db"]
    ports:
      - "6379:6379"

  web:
    profiles: ["web"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - api

volumes:
  dataforge_data:
  pgdata:
